<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charla · Casos controvertidos · Desmoide abdominal · CNC 2026</title>
<style>
/* La charla entera en una sola pantalla: la diapositiva es una imagen y el
   voto se dibuja encima, dentro de la opción impresa. No hay segunda ventana,
   no hay que cambiar de aplicación y no hay nada que recordar pulsar: al
   entrar en una diapositiva de pregunta se abre la pregunta en los móviles, y
   al pasar a la de respuesta se revela. */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: #050c12; overflow: hidden;
  font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
  color: #fff; -webkit-font-smoothing: antialiased;
}
#escena { position: absolute; inset: 0; display: grid; place-items: center; }
/* El marco mantiene la proporción 16:9 pase lo que pase: las coordenadas de
   las opciones vienen en fracciones de la diapositiva, así que la capa de
   voto solo cuadra si la imagen no se deforma ni se recorta. */
#marco {
  position: relative; background: #000;
  box-shadow: 0 0 0 1px rgba(255,255,255,.06);
}
#marco img { display: block; width: 100%; height: 100%; }

/* ---------------------------------------------------------------- voto --- */
#capa { position: absolute; inset: 0; pointer-events: none; }
.op {
  position: absolute; border-radius: .9vh; overflow: hidden;
}
.relleno {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0;
  background: rgba(14,143,168,.22);
  border-right: 2px solid rgba(14,143,168,.55);
  transition: width .45s cubic-bezier(.22,.7,.3,1);
}
.op.acierto .relleno {
  background: rgba(46,158,79,.26); border-right-color: rgba(31,125,60,.7);
}
.op.fallo { opacity: .5; }
.pct {
  position: absolute; right: 1.4%; top: 50%; transform: translateY(-50%);
  font-weight: 700; color: #0b1924; font-variant-numeric: tabular-nums;
  padding: 0 .4em; letter-spacing: -.01em;
}
.op.acierto .pct { color: #1f7d3c; }

/* --------------------------------------------------------------- chapa --- */
/* La chapa solo está puesta cuando sirve: en las diapositivas de pregunta, y
   un momento después de tocar una tecla. En la portada tapaba el logotipo. */
#chapa {
  position: absolute; display: flex; align-items: center; gap: .9em;
  opacity: 1; transition: opacity .5s;
  background: rgba(11,25,36,.9); color: #fff; border-radius: 999px;
  padding: .45em 1em; white-space: nowrap; backdrop-filter: blur(6px);
}
#chapa b { font-variant-numeric: tabular-nums; }
#chapa.oculta { opacity: 0; }
#chapa .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.22); }
#reloj.bien { color: #8fe3a8; } #reloj.mal { color: #ffc98a; }
.punto { width: .62em; height: .62em; border-radius: 50%; background: #c0392b; }
.punto.bien { background: #35c46f; } .punto.regular { background: #e8a33d; }

/* ---------------------------------------------------------------- ayuda --- */
#ayuda {
  position: absolute; inset: 0; display: none; place-items: center;
  background: rgba(5,12,18,.92); font-size: 2.1vh; line-height: 1.8;
}
#ayuda.visible { display: grid; }
#ayuda div { max-width: 34em; }
#ayuda kbd {
  display: inline-block; min-width: 2.4em; text-align: center;
  background: #16303f; border: 1px solid #27506a; border-radius: .35em;
  padding: .1em .5em; margin-right: .6em; font-family: inherit; font-size: .9em;
}
#aviso {
  position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%);
  background: #8c1d16; padding: .5em 1.1em; border-radius: 999px;
  font-size: 1.8vh; display: none;
}
#aviso.visible { display: block; }
</style>
</head>
<body>

<div id="escena">
  <div id="marco">
    <img id="diapo" alt="">
    <div id="capa"></div>
    <div id="chapa">
      <span class="punto" id="punto"></span>
      <span><b id="n">0</b> <span id="palabra">votos</span></span>
      <span class="sep"></span>
      <span id="reloj">0:00</span>
      <span class="sep"></span>
      <span><b id="num">1</b>/<span id="tot">36</span></span>
    </div>
    <div id="aviso"></div>
    <div id="ayuda"><div>
      <p><kbd>→</kbd>Siguiente diapositiva. La pregunta se abre sola.</p>
      <p><kbd>←</kbd>Anterior.</p>
      <p><kbd>R</kbd>Revelar o esconder la respuesta sin cambiar de diapositiva.</p>
      <p><kbd>B</kbd>Borrar los votos de la pregunta que está en pantalla.</p>
      <p><kbd>T</kbd>Poner el cronómetro a cero.</p>
      <p><kbd>F</kbd>Pantalla completa.</p>
      <p><kbd>H</kbd>Cerrar esta ayuda.</p>
    </div></div>
  </div>
</div>

<script type="module">
import { PREGUNTAS } from "./preguntas.js?v=91b9b4144b";
import { datos, contar } from "./datos.js";

const $ = (id) => document.getElementById(id);
const porId = Object.fromEntries(PREGUNTAS.map((p) => [p.id, p]));

const indice = await fetch("diapos/indice.json").then((r) => r.json());
const DIAPOS = indice.diapositivas;
const PROPORCION = indice.proporcion || 16 / 9;
// El tiempo previsto acumulado hasta el principio de cada diapositiva: es lo
// que convierte el cronómetro en algo útil, porque dice si vas por delante o
// por detrás del guión, no solo cuánto llevas.
const PREVISTO = indice.duraciones.reduce(
  (acc, d) => (acc.push(acc[acc.length - 1] + d), acc), [0]);

let i = 0;
let votos = {};
let estado = { pregunta: null, revelada: false };
let arranque = null;

$("tot").textContent = DIAPOS.length;

// ------------------------------------------------------------- geometría ---
// La chapa y el texto se dimensionan con el alto real del marco, no con vh:
// si no, al proyectar en 4:3 la chapa se iba de tamaño.
function encajar() {
  const m = $("marco"), W = innerWidth, H = innerHeight;
  const w = Math.min(W, H * PROPORCION), h = w / PROPORCION;
  m.style.width = w + "px";
  m.style.height = h + "px";
  m.style.fontSize = (h * 0.026) + "px";
  $("chapa").style.right = (w * 0.012) + "px";
  $("chapa").style.top = (h * 0.135) + "px";
  pintarVoto();
}
addEventListener("resize", encajar);

// --------------------------------------------------------------- imagen ---
const url = (n) => `diapos/${String(n + 1).padStart(2, "0")}.jpg`;
const precargadas = new Map();
function precargar(n) {
  if (n < 0 || n >= DIAPOS.length || precargadas.has(n)) return;
  const im = new Image(); im.src = url(n); precargadas.set(n, im);
}

// Y, de fondo, la charla entera. Son cinco megas: si el wifi de la sala se
// cae a mitad, las diapositivas que faltan ya están en la caché del navegador.
async function precargarTodo() {
  for (let n = 0; n < DIAPOS.length; n++) {
    precargar(n);
    await new Promise((r) => setTimeout(r, 120));
  }
}

// ------------------------------------------------------------ capa voto ---
function montarCapa() {
  const capa = $("capa");
  capa.innerHTML = "";
  const d = DIAPOS[i];
  if (d.tipo !== "pregunta") return;
  for (const o of d.opciones) {
    const caja = document.createElement("div");
    caja.className = "op";
    caja.dataset.opcion = o.id;
    caja.style.left = o.x * 100 + "%";
    caja.style.top = o.y * 100 + "%";
    caja.style.width = o.w * 100 + "%";
    caja.style.height = o.h * 100 + "%";
    caja.innerHTML = '<div class="relleno"></div><div class="pct"></div>';
    capa.appendChild(caja);
  }
}

function pintarVoto() {
  const d = DIAPOS[i];
  if (!d || !d.pid) { $("n").textContent = "0"; $("palabra").textContent = "votos"; return; }
  const p = porId[d.pid];
  const conteo = contar(votos[d.pid], p.opciones);
  const total = conteo.total;
  $("n").textContent = String(total);
  $("palabra").textContent = total === 1 ? "voto" : "votos";
  // En la diapositiva de respuesta no hay opciones que rellenar, pero el
  // recuento sigue siendo el de la pregunta que se acaba de contestar.
  if (d.tipo !== "pregunta") return;
  // El tamaño del porcentaje se ata al de la propia opción impresa, para que
  // parezca parte de la diapositiva y no una etiqueta pegada encima.
  const alto = $("marco").clientHeight * d.opciones[0].h;
  for (const caja of document.querySelectorAll(".op")) {
    const id = caja.dataset.opcion;
    const pct = total ? Math.round(((conteo[id] || 0) / total) * 100) : 0;
    caja.querySelector(".relleno").style.width = pct + "%";
    const num = caja.querySelector(".pct");
    num.style.fontSize = (alto * 0.46) + "px";
    num.textContent = total ? pct + "%" : "";
    caja.classList.toggle("acierto", estado.revelada && id === p.correcta);
    caja.classList.toggle("fallo", estado.revelada && id !== p.correcta);
  }
}

// ----------------------------------------------------------- navegación ---
function sincronizar() {
  const d = DIAPOS[i];
  if (d.tipo === "pregunta") datos.fijarEstado({ pregunta: d.pid, revelada: false });
  else if (d.tipo === "respuesta") datos.fijarEstado({ pregunta: d.pid, revelada: true });
  else datos.fijarEstado({ pregunta: null, revelada: false });
}

function mostrar(n, { publicar = true } = {}) {
  i = Math.max(0, Math.min(DIAPOS.length - 1, n));
  $("diapo").src = url(i);
  $("num").textContent = i + 1;
  if (arranque === null && i > 0) arranque = Date.now();
  montarCapa();
  if (publicar) sincronizar();
  pintarVoto();
  asomarChapa();
  precargar(i + 1); precargar(i + 2); precargar(i - 1);
}

function saltar(paso) { mostrar(i + paso); }

// La chapa se queda puesta en las preguntas, que es donde el recuento importa,
// y en el resto aparece dos segundos tras cualquier tecla.
let relojOcultar = null;
function asomarChapa() {
  const fija = DIAPOS[i].tipo === "pregunta" || DIAPOS[i].tipo === "respuesta";
  $("chapa").classList.remove("oculta");
  clearTimeout(relojOcultar);
  if (!fija) relojOcultar = setTimeout(
    () => $("chapa").classList.add("oculta"), 2200);
}

// ------------------------------------------------------------ cronómetro ---
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
setInterval(() => {
  const r = $("reloj");
  if (arranque === null) { r.textContent = "0:00"; r.className = ""; return; }
  const va = (Date.now() - arranque) / 1000;
  // Se enseñan los dos números, el real y el previsto, en vez de un semáforo:
  // ir muy por delante no es «bien», quiere decir que te has saltado algo.
  const toca = Math.max(0, PREVISTO[i] - PREVISTO[1]);
  r.textContent = `${mmss(va)} / ${mmss(toca)}`;
  r.className = va > toca + 45 ? "mal" : (va < toca + 20 ? "bien" : "");
  r.title = "Tiempo real / tiempo previsto a esta altura del guión";
}, 500);

// --------------------------------------------------------------- teclado ---
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  asomarChapa();
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Enter") {
    e.preventDefault(); saltar(1);
  } else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") {
    e.preventDefault(); saltar(-1);
  } else if (k === "Home") { mostrar(0); }
  else if (k === "End") { mostrar(DIAPOS.length - 1); }
  else if (k === "r" || k === "R") {
    const d = DIAPOS[i];
    if (d.tipo === "pregunta" || d.tipo === "respuesta")
      datos.fijarEstado({ pregunta: d.pid, revelada: !estado.revelada });
  } else if (k === "b" || k === "B") {
    const d = DIAPOS[i];
    if (d.pid && confirm(`¿Borrar los votos de la pregunta ${d.n || ""}?`))
      datos.reiniciar(d.pid);
  } else if (k === "t" || k === "T") { arranque = Date.now(); }
  else if (k === "f" || k === "F") {
    document.fullscreenElement ? document.exitFullscreen()
                               : document.documentElement.requestFullscreen();
  } else if (k === "h" || k === "H" || k === "?") {
    $("ayuda").classList.toggle("visible");
  } else if (k === "Escape") { $("ayuda").classList.remove("visible"); }
});

// Clic: mitad derecha avanza, mitad izquierda retrocede. Sirve para los mandos
// que emulan ratón y para pasar desde una tableta.
addEventListener("click", (e) => {
  if ($("ayuda").classList.contains("visible")) {
    $("ayuda").classList.remove("visible"); return;
  }
  saltar(e.clientX > innerWidth / 2 ? 1 : -1);
});

// --------------------------------------------------------------- conexión ---
function pintarConexion(res) {
  const punto = $("punto"), aviso = $("aviso");
  const mal = !res || res.modo === "local";
  punto.className = "punto " + (mal ? "" :
    (res.conectados < res.total ? "regular" : "bien"));
  punto.title = res ? (res.detalle || res.modo) : "sin conexión";
  aviso.classList.toggle("visible", mal);
  if (mal) aviso.textContent = "Sin conexión con la sala — los móviles no "
                             + "reciben las preguntas. Pide el voto a mano alzada.";
}
if (datos.alCambiarConexion) datos.alCambiarConexion(pintarConexion);

encajar();
mostrar(0, { publicar: false });
precargarTodo();

datos.conectar().then((res) => {
  pintarConexion(res);
  // Se publica el estado de la diapositiva en la que estamos. En la portada
  // eso deja la sala limpia, y si la conexión ha tardado más que el ponente en
  // pasar diapositivas, recupera la pregunta en la que está de verdad: poner
  // aquí un reinicio fijo borraba la pregunta que ya había abierto.
  sincronizar();
  datos.escucharEstado((e) => { estado = e; pintarVoto(); });
  datos.escucharVotos((v) => { votos = v; pintarVoto(); });
}).catch(() => pintarConexion(null));
</script>
</body>
</html>
