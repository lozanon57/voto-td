<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentador · Tumores desmoides intraabdominales · CNC 2026</title>
<link rel="stylesheet" href="estilo.css?v=e69d5f131d">
</head>
<body>

<div class="pantalla">

  <header class="cabecera">
    <div class="izq">36 CONGRESO NACIONAL DE CIRUGÍA · CNC 2026</div>
    <div class="der">TUMORES DESMOIDES INTRAABDOMINALES</div>
  </header>

  <main class="cuerpo">
    <div>
      <p class="etiqueta" id="etiqueta">Sala abierta</p>
      <h1 id="pregunta">Escanee el código y espere a la primera pregunta</h1>
      <p class="contexto" id="contexto"></p>
      <div class="barras" id="barras"></div>
      <div class="respuesta oculto" id="respuesta">
        <p class="clave" id="clave"></p>
        <p class="detalle" id="detalle"></p>
        <p class="refs" id="refs"></p>
      </div>
    </div>

    <aside class="lateral">
      <div class="qr"><img id="qr" src="assets/qr.png" alt="Código QR para votar"></div>
      <div class="url" id="url"></div>
      <div class="instruccion">Escanee con la cámara del móvil.<br>No hace falta instalar nada.</div>
      <div class="contador"><span id="n">0</span><span id="palabra">votos</span></div>
      <div class="conexion" id="conexion">Conectando…</div>
    </aside>
  </main>

  <div class="mandos oculto" id="mandos">
    <button id="sala" title="Pantalla de sala (tecla 0)">Sala</button>
    <button id="anterior" title="Anterior (flecha izquierda)">◀</button>
    <span class="numeros" id="numeros"></span>
    <button id="siguiente" title="Siguiente (flecha derecha)">▶</button>
    <button id="revelar" title="Mostrar u ocultar la respuesta (tecla R)">Mostrar respuesta</button>
    <span class="sep"></span>
    <button id="reiniciar" class="peligro">Borrar votos</button>
  </div>

  <div class="piecera">
    <span>2 AL 5 DE NOVIEMBRE DE 2026 · MADRID</span>
    <span>ASOCIACIÓN ESPAÑOLA DE CIRUGÍA</span>
  </div>
</div>

<script type="module">
import { PREGUNTAS } from "./preguntas.js?v=fc9201a4cd";
import { datos, contar } from "./datos.js";

const $ = (id) => document.getElementById(id);
const porId = Object.fromEntries(PREGUNTAS.map((p) => [p.id, p]));
const orden = PREGUNTAS.map((p) => p.id);

// Los mandos salen por defecto: esta página es la del ponente. Para proyectarla
// sin botones se abre con ?publico=1.
const mando = new URLSearchParams(location.search).get("publico") !== "1";

$("url").textContent = location.href
  .replace(/presentador\.html.*$/, "")
  .replace(/^https?:\/\//, "")
  .replace(/\/$/, "");

let estado = { pregunta: null, revelada: false };
let votos = {};
let pintada = null;

// ------------------------------------------------------------- barras ------

function montar(p) {
  const cont = $("barras");
  cont.innerHTML = "";
  p.opciones.forEach((o) => {
    const fila = document.createElement("div");
    fila.className = "fila";
    fila.dataset.opcion = o.id;
    fila.innerHTML =
      '<div class="letra">' + o.id + "</div>" +
      '<div class="pista"><div class="relleno"></div><div class="texto"></div></div>' +
      '<div class="pct"></div>';
    fila.querySelector(".texto").textContent = o.texto;
    cont.appendChild(fila);
  });
  pintada = p.id;
}

function pintar() {
  const p = estado.pregunta ? porId[estado.pregunta] : null;

  if (!p) {
    pintada = null;
    $("etiqueta").textContent = "Sala abierta";
    $("pregunta").textContent = "Escanee el código y espere a la primera pregunta";
    $("contexto").textContent = "";
    $("barras").innerHTML = "";
    $("respuesta").classList.add("oculto");
    $("n").textContent = "0";
    $("palabra").textContent = "votos";
    marcarMandos();
    return;
  }

  if (pintada !== p.id) montar(p);

  const n = orden.indexOf(p.id) + 1;
  $("etiqueta").textContent = `Pregunta ${n} de ${orden.length} · ${p.etiqueta}`;
  $("pregunta").textContent = p.pregunta;
  $("contexto").textContent = p.enunciado;

  const conteo = contar(votos[p.id], p.opciones);
  const total = conteo.total;
  $("n").textContent = String(total);
  $("palabra").textContent = total === 1 ? "voto" : "votos";

  document.querySelectorAll(".fila").forEach((fila) => {
    const id = fila.dataset.opcion;
    const pct = total ? Math.round(((conteo[id] || 0) / total) * 100) : 0;
    fila.querySelector(".relleno").style.width = pct + "%";
    fila.querySelector(".pct").textContent = total ? pct + "%" : "";
    fila.classList.toggle("es-correcta", estado.revelada && id === p.correcta);
    fila.classList.toggle("atenuada", estado.revelada && id !== p.correcta);
  });

  const r = $("respuesta");
  if (estado.revelada) {
    $("clave").textContent = "Respuesta " + p.correcta + ". " + p.clave;
    $("detalle").textContent = p.explicacion;
    $("refs").textContent = p.referencias;
    r.classList.remove("oculto");
  } else {
    r.classList.add("oculto");
  }

  marcarMandos();
}

// ------------------------------------------------------------- mandos ------

function marcarMandos() {
  if (!mando) return;
  document.querySelectorAll("#numeros button").forEach((b) => {
    b.classList.toggle("activo", b.dataset.pid === estado.pregunta);
  });
  $("sala").classList.toggle("activo", !estado.pregunta);
  $("revelar").textContent = estado.revelada ? "Ocultar respuesta" : "Mostrar respuesta";
  $("revelar").classList.toggle("activo", !!estado.revelada);
}

const ir = (pid) => datos.fijarEstado({ pregunta: pid, revelada: false });

function saltar(paso) {
  const i = orden.indexOf(estado.pregunta);
  if (i === -1) return ir(paso > 0 ? orden[0] : null);
  const j = i + paso;
  if (j < 0) return ir(null);
  if (j >= orden.length) return;
  ir(orden[j]);
}

if (mando) {
  // Marca la página como "la del ponente": en el móvil el CSS esconde el QR
  // para dejarle la pantalla a las barras.
  document.body.classList.add("con-mandos");
  $("mandos").classList.remove("oculto");
  const nums = $("numeros");
  PREGUNTAS.forEach((p, i) => {
    const b = document.createElement("button");
    b.textContent = String(i + 1);
    b.dataset.pid = p.id;
    b.title = p.etiqueta;
    b.addEventListener("click", () => ir(p.id));
    nums.appendChild(b);
  });
  $("sala").addEventListener("click", () => ir(null));
  $("anterior").addEventListener("click", () => saltar(-1));
  $("siguiente").addEventListener("click", () => saltar(1));
  $("revelar").addEventListener("click", () =>
    datos.fijarEstado({ revelada: !estado.revelada }));
  $("reiniciar").addEventListener("click", () => {
    if (!estado.pregunta) return;
    const p = porId[estado.pregunta];
    const n = orden.indexOf(p.id) + 1;
    if (confirm(`¿Borrar todos los votos de la pregunta ${n}?`)) datos.reiniciar(p.id);
  });
  addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); saltar(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); saltar(-1); }
    else if (e.key === "0" || e.key === "Escape") ir(null);
    else if (e.key === "r" || e.key === "R")
      datos.fijarEstado({ revelada: !estado.revelada });
  });
}

// ----------------------------------------------------------- conexión ------

function pintarConexion(res) {
  const cx = $("conexion");
  cx.textContent = res.detalle || res.modo;
  cx.className = "conexion " +
    (res.modo === "local" ? "mal" : (res.conectados < res.total ? "regular" : "bien"));
}
if (datos.alCambiarConexion) datos.alCambiarConexion(pintarConexion);

datos.conectar().then((res) => {
  pintarConexion(res);
  datos.escucharEstado((e) => { estado = e; pintar(); });
  datos.escucharVotos((v) => { votos = v; pintar(); });
}).catch((err) => {
  const cx = $("conexion");
  cx.textContent = "Sin conexión";
  cx.className = "conexion mal";
  $("pregunta").textContent = "No se ha podido conectar: " + (err && err.message ? err.message : "");
});
</script>
</body>
</html>
